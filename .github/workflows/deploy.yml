name: Deploy to Void

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: "void-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      VOID_API_URL: https://api.void.cloud
    steps:
      - name: Checkout
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup vp
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true

      - name: Connect to Void
        run: vp exec void connect "$VOID_API_URL" --no-login

      - name: Deploy to Void
        run: vp run deploy
